name: sync base into branches
run-name: sync branches @ ${{ github.sha }}

on:
  push:
    branches: base
    paths-ignore:
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}
  queue: max

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: setup checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: merge base in every branch
        env:
          BASE: base
          # EXCLUDE: ${{ vars.SYNC_EXCLUDE }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for branch in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | grep -vxE "HEAD|$BASE"); do
            echo "::group::$branch"

            # if [[ " $EXCLUDE " == *" $branch "* ]]; then
            #   echo "::notice::skipping $branch (defined as to be excluded)"
            #   echo "::endgroup::"
            #   continue
            # fi

            git switch -q "$branch"

            git merge --no-ff --no-commit --log -m "chore: sync with $BASE" "$BASE" || true
            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "::notice::$branch already up-to-date"
              echo "::endgroup::"
              continue
            fi
            git rm -rqf --ignore-unmatch .github/

            git commit --no-edit
            git push

            echo "::endgroup::"
          done
